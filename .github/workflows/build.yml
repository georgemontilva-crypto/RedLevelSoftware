name: Compilar Red Level

# Cada subida a main compila el instalador en un Windows real, lo prueba y lo publica en Releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dependencias de la interfaz
        run: npm ci

      - name: Pruebas del núcleo
        run: cargo test -p redlevel-core

      - name: Compilar el instalador
        run: npm run tauri build

      - name: Autoprueba en Windows
        shell: pwsh
        run: |
          $demo = "$env:RUNNER_TEMP\demo"
          cargo run -q -p redlevel-core --example make_demo -- $demo
          $env:REDLEVEL_STEAM_ROOT = "$demo\steam"
          $env:REDLEVEL_EPIC_MANIFESTS = "$demo\epic\Manifests"
          New-Item -ItemType Directory -Force prueba | Out-Null
          $p = Start-Process "$PWD\target\release\red-level.exe" -ArgumentList "--selftest", "$PWD\prueba\autoprueba.json" -Wait -PassThru
          Get-Content prueba\autoprueba.json
          if ($p.ExitCode -ne 0) { Write-Error "La autoprueba falló (código $($p.ExitCode))"; exit 1 }

      - name: Abrir el programa y comprobar que arranca, bloquea y sale limpio
        shell: pwsh
        run: ./scripts/prueba-ventana.ps1

      # El icono que Windows enseña para el programa y para el instalador, guardado como imagen para revisarlo.
      - name: Comprobar los iconos
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force prueba | Out-Null
          $instalador = (Get-ChildItem "target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1).FullName
          foreach ($par in @(@("programa", "$PWD\target\release\red-level.exe"), @("instalador", $instalador))) {
            $icono = [System.Drawing.Icon]::ExtractAssociatedIcon($par[1])
            $icono.ToBitmap().Save("$PWD\prueba\icono-$($par[0]).png")
          }

      - name: Guardar capturas y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba
          path: prueba

      # Las mismas capturas, en una rama aparte, para poder revisarlas sin descargar nada.
      - name: Dejar las capturas en la rama "capturas"
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tmp = "$env:RUNNER_TEMP\capturas"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item prueba\* $tmp
          Set-Location $tmp
          git init -q -b capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas de la compilación $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" capturas

      - name: Publicar el instalador
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $built = Get-ChildItem "target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          $asset = "RedLevel-Setup-$version.exe"
          Copy-Item $built.FullName $asset
          gh release delete "v$version" --yes --cleanup-tag 2>$null
          Start-Sleep -Seconds 3
          gh release create "v$version" $asset --target $env:GITHUB_SHA --title "Red Level $version" --notes "Instalador de Red Level $version para Windows 10 y 11 (64 bits)."
