name: Probar la web

# Cada cambio en la web se compila y se prueba contra un MySQL real: registro, sesión,
# descarga, sincronización del programa, panel de usuarios y borrado de cuenta.

on:
  push:
    branches: [main]
    paths: ["web/**", "Dockerfile", ".dockerignore", ".github/workflows/web.yml"]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/redlevel
      ADMIN_EMAILS: admin@prueba.test
      PORT: 3000
      # Guardado en la nube: la prueba levanta un R2 de mentira en este puerto.
      R2_ENDPOINT: http://127.0.0.1:9100
      R2_ACCESS_KEY_ID: prueba
      R2_SECRET_ACCESS_KEY: prueba
      R2_BUCKET: redlevel
      CLOUD_SAVE_MAX_MB: 1
      # Novedades: la prueba sirve un canal RSS y una tienda de mentira en este puerto.
      NEWS_FEEDS: http://127.0.0.1:9101/rss.xml
      STEAM_STORE_URL: http://127.0.0.1:9101
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Arrancar MySQL
        run: |
          sudo systemctl start mysql
          mysql -uroot -proot -e "CREATE DATABASE redlevel CHARACTER SET utf8mb4"

      # Las mismas imágenes que construye Railway: la de la carpeta web y la de la raíz del repo.
      - name: Construir las imágenes como en Railway
        working-directory: .
        run: |
          docker build -t redlevel-web-carpeta ./web
          docker build -t redlevel-web-raiz .

      - name: Arrancar las dos imágenes y probar la API en cada una
        run: |
          docker run -d --name carpeta --network host -e DATABASE_URL -e ADMIN_EMAILS -e R2_ENDPOINT -e R2_ACCESS_KEY_ID -e R2_SECRET_ACCESS_KEY -e R2_BUCKET -e CLOUD_SAVE_MAX_MB -e NEWS_FEEDS -e STEAM_STORE_URL -e PORT=3000 redlevel-web-carpeta
          docker run -d --name raiz --network host -e DATABASE_URL -e ADMIN_EMAILS -e R2_ENDPOINT -e R2_ACCESS_KEY_ID -e R2_SECRET_ACCESS_KEY -e R2_BUCKET -e CLOUD_SAVE_MAX_MB -e NEWS_FEEDS -e STEAM_STORE_URL -e PORT=3001 redlevel-web-raiz
          for puerto in 3000 3001; do
            for i in $(seq 1 30); do curl -sf "http://localhost:$puerto/api/health" > /dev/null && break; sleep 1; done
            BASE="http://localhost:$puerto" node test/api.test.mjs || (docker logs carpeta; docker logs raiz; exit 1)
          done
